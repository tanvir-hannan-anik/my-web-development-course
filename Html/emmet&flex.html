<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            font-size: 1.5rem;
        }

        .container {
            display: flex;
            justify-content: center;
            /* gap:20px; */
            /* flex-direction: row-reverse; */
        }

        .box {
            border: 2px solid blue;
            height: 100px;
            width: 100px;
            margin: 10px;
        }

        .user-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .user {
            border: 2px solid rgb(255, 145, 0);
            height: 100px;
            width: 100px;
            margin: 10px;
        }
        .picture-container{
            display: flex;
            border: 2px solid black;
            justify-content: center;
            align-items: center;
            height: 500px;
        }
        .picture{
            border: 3px solid purple;
            width: 200px;
            height: 200px;
        }
    </style>
</head>

<body>
    <div class="picture-container">
        <div class="picture">picture</div>
    </div>

    <div class="container">
        <div class="box">box1</div>
        <div class="box">box2</div>
        <div class="box">box3</div>
        <div class="box">box4</div>
        <div class="box">box5</div>
    </div>
    <div class="user-container">
        <div class="user">user1</div>
        <div class="user">user2</div>
        <div class="user">user3</div>
        <div class="user">user4</div>
        <div class="user">user5</div>
        <div class="user">user6</div>
        <div class="user">user7</div>
        <div class="user">user8</div>
        <div class="user">user9</div>
        <div class="user">user10</div>
        <div class="user">user11</div>
        <div class="user">user12</div>
        <div class="user">user13</div>
        <div class="user">user14</div>
        <div class="user">user15</div>
        <div class="user">user16</div>
        <div class="user">user17</div>
        <div class="user">user18</div>
        <div class="user">user19</div>
        <div class="user">user20</div>
    </div>
</body>

</html>
