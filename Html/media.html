<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <section>
        <img src="media/messi.webp" alt="" height="100px" width="200px" /><br />
        <audio controls src="media/goat.mp3"></audio>
      </section>
      <video
        controls
        src="media/football.mp4"
        height="100px"
        width="200px"
      ></video>
      <br />
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/AlnHNi0hdO0?si=9G12OMWXxPOCKzab"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </main>
  </body>
</html>
